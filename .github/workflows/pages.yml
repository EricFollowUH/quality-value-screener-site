name: Validate and Publish Daily Market Snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest tests/test_build_us_market_snapshot.py
      - name: Refresh exchange universe or retain its original coverage date
        run: node scripts/cache-market-universe.mjs
      - name: Cache fresh public company facts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/cache-company-facts.mjs
      - name: Refresh provider quotes without changing failed quote timestamps
        run: node scripts/cache-market-quotes.mjs
      - name: Recalculate every covered company and reject invalid artifacts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python3 -m scripts.refresh_market
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
